{{define "admin_ipre"}}
{{template "_header" .}}
<div class="wrap">{{template "_adminnav" .}}
<div class="card"><h2>🚷 IP 黑名单

<table><thead><tr><th>ID</th><th>起始 IP</th><th>结束 IP</th></tr></thead>

</div></div></div>
{{template "_footer" .}}
{{end}}
