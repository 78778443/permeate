{{define "admin_backup"}}
{{template "_header" .}}
<div class="wrap">{{template "_adminnav" .}}
<div class="card" style="max-width:560px;margin:0 auto;"><h2>💾 数据库备份</h2><div class="body">
<div class="alert info">教学警告：备份文件名参数会直接拼接到系统命令（命令执行漏洞）。<br>
<span class="muted">可尝试：<code>anything;whoami</code> 或 <code>anything||id</code></span></div>
<form method="post" action="/admin/index.php?m=backup&a=_do_backup">

</form>
{{if .Output}}<pre>{{.Output}}</pre>{{end}}
</div></div></div>
{{template "_footer" .}}
{{end}}
