{{define "admin_ping"}}
{{template "_header" .}}
<div class="wrap">{{template "_adminnav" .}}
<div class="card" style="max-width:560px;margin:0 auto;"><h2>🌐 Ping 工具</h2><div class="body">
<div class="alert info">教学警告：IP 参数直接拼接系统命令（命令执行漏洞）。<br>
<span class="muted">可尝试：<code>127.0.0.1; id</code> 或 <code>127.0.0.1 | whoami</code></span></div>
<form method="post" action="/admin/index.php?m=backup&a=_do_ping">
<label>IP 地址</label><input type="text" name="ip" value="127.0.0.1">
<div class="form-actions"><button class="btn primary" type="submit">Ping</button></div>
</form>
{{if .Cmd}}<p class="muted">执行命令：<code>{{.Cmd}}</code></p>{{end}}
{{if .Output}}<pre>{{.Output}}</pre>{{end}}
</div></div></div>
{{template "_footer" .}}
{{end}}
